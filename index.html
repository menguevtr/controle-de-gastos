<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de gastos</title>
<style>
:root{
  --bg:#f3f4fa; --card:#fff; --ink:#1b1f3a; --muted:#6b7090; --line:#e6e8f2;
  --primary:#5b5bd6; --primary-ink:#fff; --in:#0f9f78; --out:#e5484d;
  --hero:#1b1f3a; --hero-ink:#fff; --shadow:0 1px 2px rgba(27,31,58,.04),0 8px 24px rgba(27,31,58,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1120; --card:#181b32; --ink:#eceefb; --muted:#9a9fc4; --line:#272b4a;
    --primary:#8081f0; --primary-ink:#0f1120; --in:#3dd6a8; --out:#ff7a7f;
    --hero:#23275a; --hero-ink:#fff; --shadow:none; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.topo h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.02em}
.mes{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.mes button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;font-size:1.1rem}
.mes button:hover{background:var(--bg)}
.mes span{min-width:128px;text-align:center;font-weight:600;font-size:.95rem;text-transform:capitalize}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(128,129,240,.28)}
.hero small{opacity:.75;font-size:.9rem}
.hero .saldo{font-size:2.4rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0 18px;overflow-wrap:anywhere;position:relative;z-index:1}
.pills{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.pill{flex:1;min-width:130px;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px}
.pill b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill.r b{color:#5ff0c0} .pill.d b{color:#ff9a9e}

.card{background:var(--card);border-radius:20px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.card h2{font-size:1rem;margin:0 0 14px;font-weight:700}

.graf{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative;background:var(--line)}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.donut-t{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;line-height:1.2}
.donut-t small{color:var(--muted);font-size:.75rem}
.donut-t b{font-size:.95rem;font-variant-numeric:tabular-nums}
.leg{flex:1;min-width:190px;display:grid;gap:8px}
.leg div{display:flex;align-items:center;gap:8px;font-size:.92rem}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1}
.leg em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 0}
li + li{border-top:1px solid var(--line)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;flex:none}
li .info{flex:1;min-width:0}
li .info b{display:block;font-weight:600;overflow-wrap:anywhere}
li .info small{color:var(--muted)}
li .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
li .x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:1.1rem}
li .x:hover{background:var(--bg);color:var(--out)}
.vazio{color:var(--muted);margin:0;font-size:.95rem}

.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.88rem;color:var(--muted)}
.btn:hover{color:var(--ink)}
.nota{color:var(--muted);font-size:.82rem;margin:10px 0 0}

.fab{position:fixed;right:max(20px,calc(50% - 340px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;padding:0 24px 0 20px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(91,91,214,.45)}
.fab span{font-size:1.5rem;line-height:1}

dialog{border:0;border-radius:24px;padding:0;width:min(440px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,17,32,.55);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:1.15rem}
.dlg label{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}
.dlg input,.dlg select{background:var(--bg);border:1px solid transparent;border-radius:12px;padding:11px 12px;color:var(--ink);width:100%}
.dlg input:focus,.dlg select:focus{border-color:var(--primary);outline:none}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tipo{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.tipo label{margin:0;color:var(--ink);cursor:pointer}
.tipo input{position:absolute;opacity:0;width:0}
.tipo span{display:block;text-align:center;padding:9px;border-radius:11px;font-weight:600;font-size:.92rem;color:var(--muted)}
.tipo input:checked + span{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tipo input:focus-visible + span{outline:3px solid var(--primary)}
.valor{font-size:1.6rem!important;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px}
.bar button{flex:1;border-radius:14px;padding:13px;font-weight:600;border:0}
.salvar{background:var(--primary);color:var(--primary-ink)}
.cancelar{background:var(--bg);color:var(--muted)}

@media (max-width:480px){
  .hero .saldo{font-size:2rem}
  .mes span{min-width:104px}
  .donut{margin:0 auto}
}
@media (prefers-reduced-motion: no-preference){
  dialog[open]{animation:subir .22s ease-out}
  @keyframes subir{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main>
  <div class="topo">
    <h1>Meus gastos</h1>
    <div class="mes">
      <button id="ant" aria-label="Mês anterior">‹</button>
      <span id="mesTxt" aria-live="polite"></span>
      <button id="prox" aria-label="Próximo mês">›</button>
    </div>
  </div>

  <section class="hero" aria-label="Resumo do mês">
    <small>Saldo do mês</small>
    <div class="saldo" id="saldo">R$ 0,00</div>
    <div class="pills">
      <div class="pill r"><small>Receitas</small><b id="rec">R$ 0,00</b></div>
      <div class="pill d"><small>Despesas</small><b id="desp">R$ 0,00</b></div>
    </div>
  </section>

  <section class="card">
    <h2>Para onde foi o dinheiro</h2>
    <div class="graf" id="graf"></div>
  </section>

  <section class="card">
    <h2>Lançamentos</h2>
    <ul id="lista"></ul>
    <p class="vazio" id="vazio" hidden>Nenhum lançamento neste mês. Toque em “Novo” para adicionar.</p>
  </section>

  <div class="acoes">
    <button class="btn" id="exportar" type="button">Baixar backup</button>
    <button class="btn" id="importar" type="button">Restaurar backup</button>
    <button class="btn" id="limpar" type="button">Apagar tudo</button>
    <input type="file" id="arquivo" accept="application/json" hidden>
  </div>
  <p class="nota">Seus dados ficam salvos apenas neste navegador. Baixe um backup de vez em quando.</p>
</main>

<button class="fab" id="novo" type="button"><span aria-hidden="true">+</span>Novo</button>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h2>Novo lançamento</h2>
    <div class="tipo" role="radiogroup" aria-label="Tipo">
      <label><input type="radio" name="tipo" value="despesa" checked><span>Despesa</span></label>
      <label><input type="radio" name="tipo" value="receita"><span>Receita</span></label>
    </div>
    <label>Valor (R$)<input id="valor" class="valor" type="number" step="0.01" min="0.01" required inputmode="decimal" placeholder="0,00"></label>
    <label>Descrição<input id="descricao" required maxlength="60" placeholder="Ex.: Supermercado"></label>
    <div class="linha">
      <label>Categoria<select id="categoria"></select></label>
      <label>Data<input id="data" type="date" required></label>
    </div>
    <div class="bar">
      <button type="button" class="cancelar" id="cancelar">Cancelar</button>
      <button type="submit" class="salvar">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const CATS = {
  despesa: {
    "Moradia":["🏠","#5b5bd6"], "Alimentação":["🛒","#f5a524"], "Transporte":["🚌","#0ea5e9"],
    "Saúde":["💊","#e5484d"], "Lazer":["🎬","#d6409f"], "Educação":["📚","#8e4ec6"],
    "Contas":["💡","#12a594"], "Outros":["📦","#8b8fa8"]
  },
  receita: {
    "Renda Mensal":["💼","#0f9f78"], "Extra":["✨","#12a594"], "Investimentos":["📈","#0ea5e9"], "Outros":["📦","#8b8fa8"]
  }
};
const CHAVE = "gastos-v1";
const $ = id => document.getElementById(id);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBR = iso => iso.split("-").reverse().join("/");

let dados = [];
try { dados = JSON.parse(localStorage.getItem(CHAVE)) || []; } catch(e) {}
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch(e) {} };

const agora = new Date();
const hojeISO = `${agora.getFullYear()}-${pad(agora.getMonth()+1)}-${pad(agora.getDate())}`;
let ano = agora.getFullYear(), mes = agora.getMonth();

const tipoAtual = () => document.querySelector('input[name="tipo"]:checked').value;
function preencherCats(){
  $("categoria").innerHTML = Object.keys(CATS[tipoAtual()]).map(c => `<option>${c}</option>`).join("");
}
document.querySelectorAll('input[name="tipo"]').forEach(r => r.addEventListener("change", preencherCats));

function info(l){ return (CATS[l.tipo][l.categoria]) || ["📦","#8b8fa8"]; }

function render(){
  const ym = `${ano}-${pad(mes+1)}`;
  $("mesTxt").textContent = new Date(ano, mes, 1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const doMes = dados.filter(l => l.data.startsWith(ym)).sort((a,b) => b.data.localeCompare(a.data));
  const rec = doMes.filter(l => l.tipo==="receita").reduce((s,l)=>s+l.valor,0);
  const desp = doMes.filter(l => l.tipo==="despesa").reduce((s,l)=>s+l.valor,0);
  $("rec").textContent = brl(rec);
  $("desp").textContent = brl(desp);
  $("saldo").textContent = brl(rec - desp);

  const porCat = {};
  doMes.filter(l => l.tipo==="despesa").forEach(l => porCat[l.categoria] = (porCat[l.categoria]||0) + l.valor);
  const ord = Object.entries(porCat).sort((a,b) => b[1]-a[1]);
  if (!ord.length){
    $("graf").innerHTML = '<p class="vazio">Sem despesas neste mês.</p>';
  } else {
    let acc = 0;
    const fatias = ord.map(([c,v]) => {
      const cor = (CATS.despesa[c]||["","#8b8fa8"])[1];
      const ini = acc; acc += v/desp*100;
      return `${cor} ${ini}% ${acc}%`;
    }).join(",");
    $("graf").innerHTML = `
      <div class="donut" style="background:conic-gradient(${fatias})" role="img" aria-label="Gráfico de despesas por categoria">
        <div class="donut-t"><small>Total</small><b>${brl(desp)}</b></div>
      </div>
      <div class="leg">${ord.map(([c,v]) => `
        <div><i style="background:${(CATS.despesa[c]||["","#8b8fa8"])[1]}"></i><span>${esc(c)}</span><em>${brl(v)} · ${Math.round(v/desp*100)}%</em></div>`).join("")}
      </div>`;
  }

  $("lista").innerHTML = doMes.map(l => {
    const [emoji,cor] = info(l);
    return `<li>
      <div class="ico" style="background:${cor}22" aria-hidden="true">${emoji}</div>
      <div class="info"><b>${esc(l.descricao)}</b><small>${esc(l.categoria)} · ${dataBR(l.data)}</small></div>
      <span class="v ${l.tipo==="receita"?"in":"out"}">${l.tipo==="receita"?"+":"−"} ${brl(l.valor)}</span>
      <button class="x" type="button" data-id="${l.id}" aria-label="Excluir ${esc(l.descricao)}">✕</button>
    </li>`;
  }).join("");
  $("vazio").hidden = doMes.length > 0;
}

function mover(d){ mes += d; if (mes<0){mes=11;ano--} if (mes>11){mes=0;ano++} render(); }
$("ant").onclick = () => mover(-1);
$("prox").onclick = () => mover(1);

$("novo").onclick = () => {
  $("form").reset(); $("data").value = hojeISO; preencherCats();
  $("dlg").showModal(); $("valor").focus();
};
$("cancelar").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

$("form").addEventListener("submit", e => {
  const valor = parseFloat($("valor").value);
  if (!(valor > 0)) return;
  dados.push({ id: Date.now()+Math.random(), tipo: tipoAtual(), descricao: $("descricao").value.trim(),
    valor: Math.round(valor*100)/100, categoria: $("categoria").value, data: $("data").value });
  salvar();
  const [a,m] = $("data").value.split("-");
  ano = +a; mes = +m - 1;
  render();
});

$("lista").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  dados = dados.filter(l => String(l.id) !== b.dataset.id);
  salvar(); render();
});

$("exportar").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:"application/json"}));
  a.download = `gastos-backup-${hojeISO}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$("importar").onclick = () => $("arquivo").click();
$("arquivo").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const n = JSON.parse(r.result); if (!Array.isArray(n)) throw 0; dados = n; salvar(); render(); }
    catch(err){ alert("Arquivo inválido. Use um backup baixado por este aplicativo."); }
  };
  r.readAsText(f); e.target.value = "";
});
$("limpar").onclick = () => {
  if (confirm("Tem certeza? Isso não pode ser desfeito.")) { dados = []; salvar(); render(); }
};

preencherCats(); render();
</script>
</body>
</html>
